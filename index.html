function addP(){const n=$('#nn').value.trim();if(!n||S.P.some(p=>norm(p.n)==norm(n)))return alert('Escribí un nombre nuevo (no repetido).');S.P.push({id:S.nid++,n,c:$('#nc').value,pr:'',a:num($('#na').value),b:num($('#nb').value),d:num($('#nd').value),nt:''});save();draw()}
function delP(id){const p=pp(id),used=S.PR.some(m=>m.rec.some(r=>r[0]==id))||S.v.some(x=>x.t=='i'&&x.k==id)||S.e.some(x=>x.p==id);if(confirm('¿Eliminar "'+p.n+'"?'+(used?'\nATENCIÓN: se usa en recetas, ventas o entradas.':''))){S.P=S.P.filter(x=>x.id!=id);save();draw()}}
function prm(){const c=calc(),sel=(id,v)=>`<select id="${id}"><option value="">—</option>${S.P.map(p=>`<option value="${p.id}" ${p.id==v?'selected':''}>${esc(p.n)}</option>`).join('')}</select>`;
return `<h2>Promociones</h2><p class="sub">Precio de venta editable (amarillo). Unidades y facturación salen del registro de ventas; el costo, de la receta y los precios de PRODUCTOS.</p>
<div class="card"><div class="w"><table><tr><th>Promoción</th><th>Receta (productos que consume)</th><th class="r">Precio de venta</th><th class="r">Unid.</th><th class="r">Facturación</th><th class="r">Costo</th><th class="r">Ganancia/promo</th><th class="r">Margen</th><th></th></tr>
${S.PR.map(m=>{const co=pcost(m),pr=+m.price||0;return `<tr><td><b>${esc(m.n)}</b></td><td class="note">${m.rec.map(([i,q,v])=>q+'× '+esc(pp(i)?.n)+(v?' <i>(variante a elegir)</i>':'')).join('<br>')}</td><td class="r"><input class="in" type="number" min="0" value="${m.price??''}" placeholder="cargar" onchange="S.PR.find(x=>x.id==${m.id}).price=num(this.value);save();draw()"></td><td class="r">${c.u[m.id]||0}</td><td class="r">${fm(c.rev[m.id])}</td><td class="r">${fm(co)}</td><td class="r">${pr?'<b>'+fm(pr-co)+'</b>':'—'}</td><td class="r">${pr?((pr-co)/pr*100).toFixed(1)+'%':'—'}</td><td><button class="d" onclick="delM(${m.id})">✕</button></td></tr>`}).join('')}</table></div>
<details><summary class="note" style="cursor:pointer">➕ Nueva promoción</summary><div class="f" style="margin-top:8px"><div><label>Nombre</label><input id="mn" style="width:230px"></div><div><label>Precio de venta</label><input id="mp" type="number" class="in"></div></div>
${[1,2,3].map(i=>`<div class="f" style="margin-top:6px"><div><label>Producto ${i}</label>${sel('m'+i)}</div><div><label>Cant.</label><input id="q${i}" type="number" min="1" value="1" class="sm"></div><div><label>¿Variante?</label><input type="checkbox" id="v${i}"></div></div>`).join('')}
<div style="margin-top:6px"><label class="note">Variantes permitidas (si marcaste alguna; Ctrl/Cmd para varias)</label><br><select id="mv" multiple size="6" style="min-width:380px">${S.P.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select></div><br><button class="p" onclick="addM()">Crear promoción</button></details></div>
<h3>Venta individual de productos</h3><p class="sub">Cargá el precio de venta de los productos que vendés sueltos; se eligen en la misma lista del registro de ventas.</p>
<div class="card"><div class="f"><input value="${esc(Q)}" id="sq" oninput="sq(this.value)" placeholder="buscar producto" style="width:240px"></div><div class="w"><table><tr><th>Producto</th><th class="r">Precio de venta</th><th class="r">Unid.</th><th class="r">Facturación</th><th class="r">Costo unit.</th><th class="r">Ganancia/u</th><th class="r">Margen</th></tr>
${S.P.filter(p=>p.n.toLowerCase().includes(Q.toLowerCase())).map(p=>{const pr=+S.ip[p.id]||0,co=cost(p);return `<tr><td>${esc(p.n)}</td><td class="r"><input class="in" type="number" min="0" value="${S.ip[p.id]??''}" placeholder="no se vende suelto" onchange="S.ip[${p.id}]=num(this.value);save();draw()"></td><td class="r">${c.iu[p.id]||0}</td><td class="r">${fm(c.ir[p.id])}</td><td class="r">${fm(co)}</td><td class="r">${pr?'<b>'+fm(pr-co)+'</b>':'—'}</td><td class="r">${pr?((pr-co)/pr*100).toFixed(1)+'%':'—'}</td></tr>`}).join('')}</table></div></div>`}
function addM(){const n=$('#mn').value.trim();if(!n)return alert('Poné un nombre.');const rec=[1,2,3].filter(i=>$('#m'+i).value).map(i=>[+$('#m'+i).value,Math.max(1,+$('#q'+i).value||1),$('#v'+i).checked?1:0]);if(!rec.length)return alert('Agregá al menos un producto.');
const vars=[...$('#mv').selectedOptions].map(o=>+o.value);if(rec.some(r=>r[2])&&!vars.length)return alert('Elegí las variantes permitidas.');S.PR.push({id:S.nid++,n,price:num($('#mp').value),rec,vars});save();draw()}
function delM(id){if(confirm('¿Eliminar la promoción? Las ventas ya registradas de ella quedarán con alerta.')){S.PR=S.PR.filter(m=>m.id!=id);save();draw()}}
function opts(){return `<optgroup label="Promociones">${S.PR.map(m=>`<option value="p${m.id}">${esc(m.n)}</option>`).join('')}</optgroup><optgroup label="Productos individuales">${S.P.map(p=>`<option value="i${p.id}">${esc(p.n)}</option>`).join('')}</optgroup>`}
function vsel(){const v=$('#fp').value,pm=v[0]=='p'?S.PR.find(m=>m.id==v.slice(1)):null,vs=pm&&pm.rec.some(r=>r[2])?pm.vars:[];$('#fv').innerHTML=vs.length?vs.map(i=>`<option value="${i}">${esc(pp(i)?.n)}</option>`).join(''):'<option value="">(no aplica)</option>';$('#fv').disabled=!vs.length;tot()}
function tot(){const v=$('#fp').value,q=+$('#fq').value||0,pr=v[0]=='p'?+S.PR.find(m=>m.id==v.slice(1))?.price||0:+S.ip[v.slice(1)]||0;$('#ft').innerHTML=pr?`${fm(pr)} × ${q} = <b>${fm(pr*q)}</b>`:'<span class="nodata">⚠ sin precio cargado</span>'}
function addV(){const v=$('#fp').value,q=Math.floor(+$('#fq').value);if(!(q>0))return alert('La cantidad debe ser un entero mayor a 0.');S.v.push({d:$('#fd').value||today(),t:v[0],k:+v.slice(1),vp:v[0]=='p'&&!$('#fv').disabled?+$('#fv').value:null,q});save();draw()}
function ven(){const c=calc();return `<h2>Registro de ventas</h2><p class="sub">Elegí una promoción o un producto suelto, la cantidad (y la variante si la promo la pide). El precio y el total salen solos.</p>
<div class="card"><div class="f"><div><label>Fecha</label><input id="fd" type="date" value="${today()}"></div><div><label>Promoción o producto</label><select id="fp" onchange="vsel()" style="min-width:300px">${opts()}</select></div><div><label>Variante</label><select id="fv" style="min-width:230px"></select></div><div><label>Cantidad</label><input id="fq" type="number" min="1" value="1" class="sm" oninput="tot()"></div><div><label>Total</label><div id="ft" style="padding:7px 0"></div></div><button class="p" onclick="addV()">＋ Registrar venta</button></div></div>
<div class="card"><div class="w"><table><tr><th>Fecha</th><th>Tipo</th><th>Ítem</th><th>Variante</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Total</th><th>Estado</th><th></th></tr>${S.v.map((x,n)=>{const it=x.t=='i'?pp(x.k):S.PR.find(m=>m.id==x.k),pr=x.t=='i'?+S.ip[x.k]||0:+it?.price||0,er=c.err[n];
return `<tr><td>${x.d}</td><td><span class="pill gr">${x.t=='i'?'Individual':'Promoción'}</span></td><td>${esc(it?.n||'(eliminado)')}</td><td class="note">${x.vp!=null?esc(pp(x.vp)?.n):'—'}</td><td class="r">${x.q}</td><td class="r">${fm(pr)}</td><td class="r"><b>${fm(pr*x.q)}</b></td><td><span class="pill ${er?'bad':'ok'}">${er||'OK'}</span></td><td><button class="d" onclick="S.v.splice(${n},1);save();draw()">✕</button></td></tr>`}).reverse().join('')||'<tr><td colspan=9>Sin ventas registradas</td></tr>'}</table></div></div>`}
function eprev(r){const p=pp(+$('#ep').value);if(!p)return;if(r)$('#ec').value=cost(p);const q=+$('#eq').value||0,cu=+$('#ec').value||0,s=saldo(calc())-q*cu;$('#et').innerHTML=`Compra: ${q} × ${fm(cu)} = <b>${fm(q*cu)}</b> → saldo de la cuenta después: <b style="color:${s<0?'#b91c1c':'#065f46'}">${fm(s)}</b>`}
function addE(){const q=Math.floor(+$('#eq').value),cu=num($('#ec').value);if(!(q>0))return alert('Cantidad inválida.');const s=saldo(calc())-q*(cu||0);if(s<0&&!confirm('Con esta compra el saldo de la cuenta quedaría en '+fm(s)+'. ¿Registrar igual?'))return;S.e.push({d:$('#ed').value||today(),p:+$('#ep').value,q,c:cu});save();draw()}
function inv(){const c=calc();let L=c.I.filter(x=>x.p.n.toLowerCase().includes(Q.toLowerCase())&&(!OR||x.rp>0));
return `<h2>Inventario</h2><p class="sub">Stock actual = Stock inicial + Entradas − Ventas (promos según receta + ventas individuales).</p>
<div class="card"><div class="f"><div><label>Registrar entrada (compra a la distribuidora)</label><select id="ep" onchange="eprev(1)" style="min-width:300px">${S.P.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select></div><div><label>Fecha</label><input id="ed" type="date" value="${today()}"></div><div><label>Cantidad</label><input id="eq" type="number" min="1" value="1" class="sm" oninput="eprev()"></div><div><label>Costo unitario ($)</label><input id="ec" type="number" min="0" class="in" oninput="eprev()"></div><button class="p" onclick="addE()">Sumar al stock y descontar de la cuenta</button>
<span class="note">${S.e.length} entradas · <button class="s" onclick="if(S.e.length&&confirm('¿Borrar la última entrada?')){S.e.pop();save();draw()}">deshacer última</button></span></div><p id="et" style="margin:10px 0 0"></p><p class="note" style="margin:4px 0 0">Saldo actual de la cuenta: <b>${fm(saldo(c))}</b> (saldo inicial + ventas − compras de stock). El costo sugerido sigue la regla +1M / +300k; cambialo si pagaste otro precio.</p></div>
<div class="card"><h3 style="margin-top:0">Compras recientes</h3><table><tr><th>Fecha</th><th>Producto</th><th class="r">Cant.</th><th class="r">Costo unit.</th><th class="r">Total</th><th></th></tr>${S.e.map((x,n)=>{const cu=x.c??cost(pp(x.p));return `<tr><td>${x.d}</td><td>${esc(pp(x.p)?.n||'(eliminado)')}</td><td class="r">${x.q}</td><td class="r">${fm(cu)}</td><td class="r"><b>${fm(cu*x.q)}</b></td><td><button class="d" onclick="S.e.splice(${n},1);save();draw()">✕</button></td></tr>`}).reverse().slice(0,8).join('')||'<tr><td colspan=6>Sin compras registradas</td></tr>'}</table></div>
<div class="card"><div class="f" style="margin-bottom:10px"><input value="${esc(Q)}" id="sq" oninput="sq(this.value)" placeholder="buscar producto" style="width:240px"><label style="margin:0"><input type="checkbox" ${OR?'checked':''} onchange="OR=this.checked;draw()"> solo a reponer</label><button class="s" onclick="expRep()">⬇ Exportar pedido de reposición</button></div>
<div class="w"><table><tr><th>Producto</th><th class="r">Stock inicial</th><th class="r">Entradas</th><th class="r">Ventas</th><th class="r">Stock actual</th><th class="r">Mínimo</th><th class="r">Costo</th><th class="r">Valor</th><th>Estado</th><th class="r">A reponer</th></tr>
${L.map(x=>`<tr><td>${esc(x.p.n)}</td><td class="r"><input class="in sm" type="number" value="${S.si[x.p.id]??''}" placeholder="0" onchange="S.si[${x.p.id}]=num(this.value);save();draw()"></td><td class="r">${x.en}</td><td class="r">${x.co}</td><td class="r"><b>${x.st}</b></td><td class="r"><input class="in sm" type="number" value="${S.mn[x.p.id]??''}" placeholder="${S.def}" onchange="S.mn[${x.p.id}]=num(this.value);save();draw()"></td><td class="r">${fm(x.c)}</td><td class="r">${fm(x.st*x.c)}</td><td><span class="pill ${pc(x.es)}">${x.es}</span></td><td class="r">${x.rp?'<b>'+x.rp+'</b> · '+fm(x.rp*x.c):''}</td></tr>`).join('')}</table></div></div>`}
function cfg(){return `<h2>Configuración y respaldo</h2><p class="sub">Los datos se guardan en este navegador. Descargá una copia de seguridad seguido.</p><div class="card"><div class="f"><div><label>Stock mínimo por defecto</label><input class="in sm" type="number" value="${S.def}" onchange="S.def=+this.value;save();draw()"></div><div><label>Cobertura objetivo (× mínimo)</label><input class="in sm" type="number" value="${S.cob}" onchange="S.cob=+this.value;save();draw()"></div><div><label>Saldo inicial de la cuenta ($)</label><input class="in" style="width:140px" type="number" value="${S.caja0??''}" placeholder="0" onchange="S.caja0=num(this.value);save();draw()"></div></div>
<p>Regla de costo: precio <b>+$1.000.000</b>; si el producto no lo tiene, <b>+$300.000</b>. A reponer = si stock ≤ mínimo: (mínimo × cobertura) − stock.</p></div>
<div class="card"><div class="f"><button class="p" onclick="dl('barval-backup-'+today()+'.json',JSON.stringify(S),'application/json')">⬇ Copia de seguridad (.json)</button><div><label>Restaurar copia</label><input type="file" accept=".json" onchange="this.files[0].text().then(t=>{S=JSON.parse(t);save();draw()})"></div><button class="d" style="padding:8px 14px" onclick="if(confirm('¿Volver a los datos iniciales? Se borra todo lo cargado.')){S=init();save();draw()}">Restablecer todo</button></div></div>
<div class="card"><h3 style="margin-top:0">☁ Google Sheets</h3><p class="note">Los datos se guardan solos en tu hoja de Google después de cada cambio y se cargan al abrir la página. La clave es la que pusiste en el Apps Script; se guarda solo en este navegador.</p><div class="f"><div><label>Clave</label><input type="password" id="ck" value="${esc(ck)}" style="width:260px" autocomplete="off"></div><button class="p" onclick="setK($('#ck').value)">Guardar clave y sincronizar</button><button class="s" onclick="pull()">Sincronizar ahora</button></div><p class="note">${esc(syMsg)||'Sin sincronizar todavía'}</p></div>`}
function addO(){const x=$('#ot').value.trim();if(!x)return;(S.obs=S.obs||[]).push({id:S.nid++,d:today(),t:x,ok:0});save();draw()}
function obs(){const L=(S.obs||[]).slice().reverse(),p=L.filter(o=>!o.ok).length;return `<h2>Observaciones</h2><p class="sub">Anotaciones libres: pendientes, pedidos, recordatorios. ${p} pendiente${p==1?'':'s'}.</p>
<div class="card"><div class="f"><div style="flex:1;min-width:280px"><label>Nueva anotación</label><textarea id="ot" style="height:80px;font-family:inherit;font-size:14px" placeholder="Escribí tu nota…"></textarea></div><button class="p" onclick="addO()">＋ Agregar</button></div></div>
<div class="card">${L.map(o=>`<div class="ob ${o.ok?'d':''}"><input type="checkbox" ${o.ok?'checked':''} title="Marcar como resuelta" onchange="S.obs.find(x=>x.id==${o.id}).ok=this.checked?1:0;save();draw()"><span class="note" style="width:78px">${o.d}</span><textarea onchange="S.obs.find(x=>x.id==${o.id}).t=this.value;save()">${esc(o.t)}</textarea><button class="d" onclick="if(confirm('¿Borrar esta nota?')){S.obs=S.obs.filter(x=>x.id!=${o.id});save();draw()}">✕</button></div>`).join('')||'<p class="note">Todavía no hay anotaciones.</p>'}</div>`}
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:m||'text/csv'}));a.download=n;a.click()}
const csv=r=>r.map(l=>l.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
function expCat(){dl('catalogo-barval-'+today()+'.csv',csv([['Producto','Categoría','Presentación','+$300.000 (lista)','+$1.000.000','+$2.000.000'],...S.P.map(p=>[p.n,p.c,p.pr,p.a??'',p.b??'',p.d??''])]))}
function expRep(){dl('pedido-reposicion-'+today()+'.csv',csv([['Producto','Stock actual','A reponer (u)','Costo unitario','Costo total'],...calc().I.filter(x=>x.rp>0).map(x=>[x.p.n,x.st,x.rp,x.c,x.rp*x.c])]))}
function pn(s){s=String(s??'').replace(/[^\d,.]/g,'');if(!s)return null;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=/,\d{1,2}$/.test(s)?s.replace(',','.'):s.replace(/,/g,'');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isNaN(v)?null:v}
function impFile(f){if(f)f.text().then(impTxt)}
function impTxt(t){const rows=t.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());if(!rows.length)return alert('El archivo está vacío.');const dl_=['\t',';',','].find(d=>rows[0].includes(d))||';';let R=rows.map(l=>l.split(dl_).map(c=>c.trim().replace(/^"|"$/g,'')));
let off=1;if(/categor/i.test(R[0].join(';')))off=3;if(pn(R[0][off])==null&&!/\d/.test(R[0][off]||''))R.shift();
const up=[],nw=[],seen=new Set();R.forEach(r=>{if(!r[0])return;const a=pn(r[off]),b=pn(r[off+1]),d=pn(r[off+2]),p=S.P.find(x=>norm(x.n)==norm(r[0]));if(a==null&&b==null&&d==null)return;seen.add(norm(r[0]));p?up.push([p,a,b,d]):nw.push([r[0],off==3?r[1]:'A definir',off==3?r[2]:'',a,b,d])});
if(!up.length&&!nw.length)return alert('No se encontraron precios. Formato: Producto;Lista;+1M;+2M (o el CSV exportado).');
const ch=up.filter(([p,a,b,d])=>p.a!=a||p.b!=b||p.d!=d).length,miss=S.P.filter(p=>!seen.has(norm(p.n))).length;
if(!confirm(`Catálogo leído:\n• ${up.length} productos existentes (${ch} con precios distintos)\n• ${nw.length} productos nuevos que se agregarán\n• ${miss} productos del sistema no están en el archivo (se mantienen igual)\n\nLos precios vacíos del archivo se guardan como "sin dato". ¿Aplicar?`))return;
up.forEach(([p,a,b,d])=>{p.a=a;p.b=b;p.d=d});nw.forEach(([n,c,pr,a,b,d])=>S.P.push({id:S.nid++,n,c,pr,a,b,d,nt:'Agregado por importación'}));save();T='pro';draw()}
const tabs={res:'📊 Resumen',pro:'🏷 Productos',prm:'🎁 Promociones',ven:'🧾 Ventas',inv:'📦 Inventario',obs:'📝 Observaciones',cfg:'⚙ Configuración'};
function draw(){$('#nv').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="t ${k==T?'on':''}" onclick="T='${k}';Q='';draw()">${v}</button>`).join('');$('#m').innerHTML={res,pro,prm,ven,inv,obs,cfg}[T]();if(T=='ven')vsel();if(T=='inv')eprev(1)}
draw();pull();
</script></body></html>
